<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robo Hand Control</title>
    <link rel="stylesheet" href="style.css?v=2">
</head>
<body>

    <div class="container">
        <div id="status-card" class="card none">
            <span id="status-text">STATUS: NONE</span>
        </div>

        <div class="instruction">
            <p>Управление через URL:</p>
            <code>?status=knopka_on</code> — ВКЛ <br>
            <code>?status=knopka_off</code> — ВЫКЛ
        </div>
    </div>

    <script>
        // Читаем параметры из адресной строки
        const params = new URLSearchParams(window.location.search);
        const currentStatus = params.get('status');

        const card = document.getElementById('status-card');
        const text = document.getElementById('status-text');

        // Логика переключения классов
        if (currentStatus === 'knopka_on') {
            card.classList.remove('none', 'off');
            card.classList.add('on');
            text.innerText = 'STATUS: ON';
        } else if (currentStatus === 'knopka_off') {
            card.classList.remove('none', 'on');
            card.classList.add('off');
            text.innerText = 'STATUS: OFF';
        }
    </script>
</body>
</html>
