<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Robo Hand Control</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <div id="status-card" class="card none">
            <span id="status-text">STATUS: NONE</span>
        </div>

        <div class="instruction">
            <p>Для управления добавьте в конец адресной строки:</p>
            <code>?status=knopka_on</code> — чтобы включить <br>
            <code>?status=knopka_off</code> — чтобы выключить
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const currentStatus = params.get('status');

        const card = document.getElementById('status-card');
        const text = document.getElementById('status-text');

        if (currentStatus === 'knopka_on') {
            card.className = 'card on';
            text.innerText = 'STATUS: ON';
        } else if (currentStatus === 'knopka_off') {
            card.className = 'card off';
            text.innerText = 'STATUS: OFF';
        }
    </script>
</body>
</html>
