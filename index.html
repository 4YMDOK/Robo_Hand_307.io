<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Управление статусом</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="status-card" class="card none">
        <span id="status-text">ОЖИДАНИЕ...</span>
    </div>

    <script>
        // Скрипт считывает параметр из ссылки: ?status=knopka_on
        const params = new URLSearchParams(window.location.search);
        const currentStatus = params.get('status');

        const card = document.getElementById('status-card');
        const text = document.getElementById('status-text');

        if (currentStatus === 'knopka_on') {
            card.className = 'card on';
            text.innerText = 'STATUS: ON';
        } else if (currentStatus === 'knopka_off') {
            card.className = 'card off';
            text.innerText = 'STATUS: OFF';
        }
    </script>
</body>
</html>
